<svg viewBox="0 0 1700 1300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Insurance Claims Settlement — Corrected Agentic AI Workflow, XingAI Enterprise Design</title>
<desc>Nine-stage claims pipeline with a split fraud-triage/fraud-scoring pair around damage assessment, an explicit Case Resolution Router with labeled return paths, and a cross-cutting Compliance and Audit Trail lane feeding adverse-action letters, regulatory reporting, and fairness audits. Branded footer credits XingAI.</desc>
<style>
  .bg { fill: #ffffff; }
  .card { fill: #f8f9fb; stroke: #e2e5ea; stroke-width: 1.5; }
  .cardNew { fill: #f8f9fb; stroke: #6366f1; stroke-width: 2; }
  .cardDeny { fill: #f8f9fb; stroke: #c0392b; stroke-width: 1.5; }
  .cardRouter { fill: #eef1f5; stroke: #6366f1; stroke-width: 2; }
  .cardAudit { fill: #eef1f5; stroke: #c7ccd6; stroke-width: 1.5; }
  .cardEnd { fill: #f8f9fb; stroke: #1e8e5a; stroke-width: 2; }
  .title { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 700; fill: #16181d; }
  .subtitle { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 500; fill: #4b5563; }
  .label { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 700; fill: #16181d; }
  .sub { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 400; fill: #4b5563; }
  .tiny { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 500; fill: #8b93a1; }
  .tinyAccent { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 700; fill: #6366f1; }
  .tinyDeny { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 600; fill: #c0392b; }
  .flow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .escalate { stroke: #c0392b; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowDeny); }
  .route { stroke: #6366f1; stroke-width: 1.8; fill: none; stroke-dasharray: 2 3; marker-end: url(#arrowAccent); }
  .tap { stroke: #c7ccd6; stroke-width: 1.3; fill: none; stroke-dasharray: 1 3; }
  .badge { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 800; fill: #ffffff; }
  .brandBar { fill: #eef1f5; stroke: #e2e5ea; stroke-width: 1; }
  .brandName { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 700; fill: #16181d; }
  .brandRole { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 400; fill: #4b5563; }
  .brandNote { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 500; fill: #4b5563; }
  .brandCta { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight: 700; fill: #6366f1; }
</style>

<rect class="bg" x="0" y="0" width="1700" height="1300"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
  </marker>
  <marker id="arrowDeny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
  </marker>
</defs>

<!-- Title -->
<text x="850" y="38" text-anchor="middle" class="title" font-size="26">Insurance Claims Settlement — Corrected Agentic AI Workflow</text>
<text x="850" y="62" text-anchor="middle" class="subtitle" font-size="14">v2 · fixes fraud/damage sequencing, escalation re-entry, and compliance audit trail</text>

<!-- ROW 1 -->
<g>
  <rect class="card" x="100" y="95" width="440" height="120" rx="10"/>
  <circle cx="130" cy="120" r="14" class="card"/>
  <text x="130" y="125" text-anchor="middle" class="badge" font-size="14">1</text>
  <text x="155" y="126" class="label" font-size="16">Claim Intake Agent</text>
  <text x="120" y="155" class="sub" font-size="12">Multi-channel intake · NLP extract</text>
  <text x="120" y="174" class="tiny" font-size="11">Output: Claim ID, extracted fields</text>
</g>

<g>
  <rect class="card" x="600" y="95" width="440" height="120" rx="10"/>
  <circle cx="630" cy="120" r="14" class="card"/>
  <text x="630" y="125" text-anchor="middle" class="badge" font-size="14">2</text>
  <text x="655" y="126" class="label" font-size="16">Document Verification</text>
  <text x="620" y="155" class="sub" font-size="12">Validate identity, policy, docs</text>
  <path class="flow" d="M700,225 L700,250 L640,250 L640,270" />
  <polygon class="card" points="640,245 690,270 640,295 590,270"/>
  <text x="640" y="274" text-anchor="middle" class="tiny" font-size="10">Docs valid?</text>
  <text x="705" y="285" class="tinyDeny" font-size="11">No → Router (missing_docs)</text>
</g>

<g>
  <rect class="cardNew" x="1100" y="95" width="440" height="120" rx="10"/>
  <circle cx="1130" cy="120" r="14" class="cardNew"/>
  <text x="1130" y="125" text-anchor="middle" class="badge" font-size="14">3</text>
  <text x="1155" y="126" class="label" font-size="16">Fraud Triage Agent</text>
  <text x="1420" y="112" text-anchor="end" class="tinyAccent" font-size="10">NEW — split from old step</text>
  <text x="1120" y="155" class="sub" font-size="12">Early signals: velocity, tenure, prior claims</text>
  <text x="1120" y="174" class="tiny" font-size="11">Runs before damage cost is known</text>
  <path class="flow" d="M1200,225 L1200,250 L1170,250 L1170,270" />
  <polygon class="cardNew" points="1170,245 1220,270 1170,295 1120,270"/>
  <text x="1170" y="274" text-anchor="middle" class="tiny" font-size="10">Obvious fraud?</text>
  <text x="1225" y="285" class="tinyDeny" font-size="11">Yes → Router (fraud_investigation)</text>
</g>

<path class="flow" d="M540,155 L600,155"/>
<path class="flow" d="M1040,155 L1100,155"/>

<!-- wrap row1 -> row2 -->
<path class="flow" d="M1320,215 L1320,330 L1320,330"/>
<path class="flow" d="M1320,330 L850,330 L850,350"/>

<!-- ROW 2 -->
<g>
  <rect class="card" x="480" y="350" width="440" height="130" rx="10"/>
  <circle cx="510" cy="378" r="14" class="card"/>
  <text x="510" y="383" text-anchor="middle" class="badge" font-size="14">4</text>
  <text x="535" y="384" class="label" font-size="16">Damage Assessment</text>
  <text x="500" y="415" class="sub" font-size="12">Photo/video review, cost estimate</text>
  <text x="500" y="434" class="tiny" font-size="11">Output feeds Fraud Scoring directly →</text>
</g>

<path class="flow" d="M920,410 L980,410" stroke-width="3"/>
<text x="950" y="400" text-anchor="middle" class="tinyAccent" font-size="10">cost + photos</text>

<g>
  <rect class="cardNew" x="980" y="350" width="440" height="130" rx="10"/>
  <circle cx="1010" cy="378" r="14" class="cardNew"/>
  <text x="1010" y="383" text-anchor="middle" class="badge" font-size="14">5</text>
  <text x="1035" y="384" class="label" font-size="16">Fraud Scoring Agent</text>
  <text x="1400" y="367" text-anchor="end" class="tinyAccent" font-size="10">NEW — uses damage data</text>
  <text x="1000" y="415" class="sub" font-size="12">Deep score: cost anomaly + photo forensics</text>
  <path class="flow" d="M1080,480 L1080,505 L1050,505 L1050,525" />
  <polygon class="cardNew" points="1050,500 1100,525 1050,550 1000,525"/>
  <text x="1050" y="529" text-anchor="middle" class="tiny" font-size="10">Score high?</text>
  <text x="1105" y="540" class="tinyDeny" font-size="11">Yes → Router (fraud_investigation)</text>
</g>

<!-- wrap row2 -> row3 -->
<path class="flow" d="M700,480 L700,600 L265,600 L265,650"/>

<!-- ROW 3 -->
<g>
  <rect class="card" x="60" y="650" width="410" height="130" rx="10"/>
  <circle cx="90" cy="678" r="14" class="card"/>
  <text x="90" y="683" text-anchor="middle" class="badge" font-size="14">6</text>
  <text x="115" y="684" class="label" font-size="16">Policy Coverage</text>
  <text x="80" y="715" class="sub" font-size="12">Eligibility, limits, exclusions</text>
  <path class="flow" d="M150,780 L150,805 L120,805 L120,825"/>
  <polygon class="card" points="120,800 170,825 120,850 70,825"/>
  <text x="120" y="829" text-anchor="middle" class="tiny" font-size="9">Covered?</text>
  <text x="175" y="815" class="tinyDeny" font-size="10">No → Adverse Action</text>
  <path class="flow" d="M350,780 L350,805 L380,805 L380,825"/>
  <polygon class="card" points="380,800 430,825 380,850 330,825"/>
  <text x="380" y="829" text-anchor="middle" class="tiny" font-size="9">≤ limit?</text>
  <text x="200" y="865" class="tinyDeny" font-size="10">No → Router (estimate_dispute)</text>
</g>

<g>
  <rect class="card" x="490" y="650" width="410" height="130" rx="10"/>
  <circle cx="520" cy="678" r="14" class="card"/>
  <text x="520" y="683" text-anchor="middle" class="badge" font-size="14">7</text>
  <text x="545" y="684" class="label" font-size="16">Approval Agent</text>
  <text x="510" y="715" class="sub" font-size="12">Business rules, approval matrix</text>
  <path class="flow" d="M695,780 L695,805 L695,825"/>
  <polygon class="card" points="695,800 745,825 695,850 645,825"/>
  <text x="695" y="829" text-anchor="middle" class="tiny" font-size="9">Auto-OK?</text>
  <text x="750" y="833" class="tinyDeny" font-size="10">No → Router (high_value_review)</text>
</g>

<g>
  <rect class="card" x="920" y="650" width="380" height="130" rx="10"/>
  <circle cx="950" cy="678" r="14" class="card"/>
  <text x="950" y="683" text-anchor="middle" class="badge" font-size="14">8</text>
  <text x="975" y="684" class="label" font-size="16">Payment Processing</text>
  <text x="940" y="715" class="sub" font-size="12">Idempotent payment, reconciliation</text>
  <text x="940" y="734" class="tiny" font-size="11">Idempotency key required (see claims-mcp POC)</text>
</g>

<g>
  <rect class="cardEnd" x="1330" y="650" width="310" height="230" rx="10"/>
  <circle cx="1360" cy="678" r="14" class="cardEnd"/>
  <text x="1360" y="683" text-anchor="middle" class="badge" font-size="14">9</text>
  <text x="1385" y="684" class="label" font-size="16">Customer Comms</text>
  <text x="1350" y="715" class="sub" font-size="12">Multi-channel updates, notices</text>
  <line x1="1350" y1="735" x2="1610" y2="735" stroke="#e2e5ea" stroke-width="1"/>
  <text x="1485" y="775" text-anchor="middle" class="label" font-size="15" fill="#1e8e5a">✓ Settlement Completed</text>
  <text x="1485" y="800" text-anchor="middle" class="tiny" font-size="11">Claim settled &amp; recorded</text>
</g>

<path class="flow" d="M470,715 L490,715"/>
<path class="flow" d="M900,715 L920,715"/>
<path class="flow" d="M1300,715 L1330,715"/>

<!-- Claim Not Payable -->
<g>
  <rect class="cardDeny" x="60" y="900" width="380" height="90" rx="10"/>
  <text x="250" y="932" text-anchor="middle" class="label" font-size="15" fill="#c0392b">✕ Claim Not Payable</text>
  <text x="250" y="954" text-anchor="middle" class="tiny" font-size="11">Adverse-action letter cites specific policy clause</text>
  <text x="250" y="972" text-anchor="middle" class="tiny" font-size="11">Fraud-confirmed cases also reported to SIU/regulator</text>
</g>

<!-- Case Resolution Router -->
<g>
  <rect class="cardRouter" x="490" y="900" width="820" height="150" rx="10"/>
  <text x="900" y="928" text-anchor="middle" class="label" font-size="17">Case Resolution Router — replaces the old single loop-back</text>
  <text x="520" y="954" class="tiny" font-size="12">missing_docs, resolved  →  back to ② Document Verification</text>
  <text x="520" y="974" class="tiny" font-size="12">fraud_investigation, cleared  →  back to ⑥ Policy Coverage (flag cleared)</text>
  <text x="520" y="994" class="tiny" font-size="12">fraud_investigation, confirmed  →  Claim Not Payable + SIU report</text>
  <text x="900" y="954" class="tiny" font-size="12">estimate_dispute, adjusted  →  back to ⑦ Approval (revised figures)</text>
  <text x="900" y="974" class="tiny" font-size="12">high_value_review, approved  →  straight to ⑧ Payment (skip re-run)</text>
  <text x="900" y="994" class="tiny" font-size="12">any track, upheld deny  →  Claim Not Payable</text>
  <text x="520" y="1030" class="tinyAccent" font-size="11">Every entry carries WHY it's here — no more guessing what a human resolved.</text>
</g>

<path class="escalate" d="M440,940 L490,975"/>

<!-- Router connections back up (representative) -->
<path class="route" d="M600,900 L600,780" />
<path class="route" d="M755,900 L755,780"/>
<path class="route" d="M1000,900 L1000,780"/>
<path class="route" d="M650,900 C400,850 350,300 700,225"/>

<!-- Compliance & Audit lane -->
<g>
  <rect class="cardAudit" x="60" y="1075" width="1580" height="100" rx="10"/>
  <text x="850" y="1102" text-anchor="middle" class="label" font-size="16">Compliance &amp; Audit Trail Agent — cross-cutting, not a pipeline step</text>
  <text x="850" y="1124" text-anchor="middle" class="sub" font-size="12">Every stage above writes one immutable row: decision, confidence, model version, policy citation, human override — same shape as the XingAI Decision Ledger pattern</text>
  <text x="230" y="1155" text-anchor="middle" class="tinyAccent" font-size="11">→ Adverse Action Letters</text>
  <text x="850" y="1155" text-anchor="middle" class="tinyAccent" font-size="11">→ Regulatory Reporting (prompt-pay, SIU)</text>
  <text x="1470" y="1155" text-anchor="middle" class="tinyAccent" font-size="11">→ Fairness / Bias Audit Exports</text>
</g>

<path class="tap" d="M300,215 L300,1075"/>
<path class="tap" d="M800,480 L800,1075"/>
<path class="tap" d="M1300,480 L1300,1075"/>
<path class="tap" d="M900,1050 L900,1075"/>

<!-- Branded footer bar -->
<g>
  <rect class="brandBar" x="0" y="1200" width="1700" height="100"/>
  <circle cx="70" cy="1250" r="34" fill="#6366f1"/>
  <text x="70" y="1258" text-anchor="middle" class="badge" font-size="20">XW</text>
  <text x="122" y="1240" class="brandName" font-size="16">Created by Enterprise Architect</text>
  <text x="122" y="1262" class="brandName" font-size="18">Xing Wang</text>
  <text x="122" y="1282" class="brandRole" font-size="12">XingAI · xingai.app</text>

  <line x1="560" y1="1215" x2="560" y2="1285" stroke="#e2e5ea" stroke-width="1"/>

  <text x="600" y="1244" class="brandNote" font-size="13">🧠 Compliance &amp; Audit Trail Agent doubles as the orchestrator:</text>
  <text x="600" y="1264" class="brandNote" font-size="13">monitors every stage, learns from resolved cases, and</text>
  <text x="600" y="1284" class="brandNote" font-size="13">continuously refines routing and fraud thresholds.</text>

  <line x1="1180" y1="1215" x2="1180" y2="1285" stroke="#e2e5ea" stroke-width="1"/>

  <text x="1220" y="1250" class="brandCta" font-size="16">Connect — xingai.app</text>
  <text x="1220" y="1272" class="brandRole" font-size="12">github.com/xingaiapp · @XingAIApp</text>
</g>
</svg>
