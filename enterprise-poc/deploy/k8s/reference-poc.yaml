apiVersion: apps/v1
kind: Deployment
metadata:
  name: xingai-enterprise-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xingai-enterprise-poc
  template:
    metadata:
      labels:
        app: xingai-enterprise-poc
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: replace-with-approved-registry/xingai-enterprise-poc:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: APP_ENV
              value: production
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: xingai-enterprise-poc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: xingai-enterprise-poc
